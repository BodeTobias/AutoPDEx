[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm", "cffi>=1.15"]
build-backend = "setuptools.build_meta"

[project]
name = "autopdex"
version = "1.2.0"
description = "An automized PDE solver for accelerators based on JAX"
readme = "README.md"
authors = [
    { name = "Tobias Bode" }
]
license = "AGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"

dependencies = [
    "flax>=0.12.7",
    "jax>=0.10.0",
    "jaxlib>=0.10.0",
    "meshio>=5.3.5",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "pytest>=9.0.3",
    "xxhash>=3.6.0",
    "cffi>=1.15"
]

[project.optional-dependencies]
dev = [
    "pypardiso>=0.4.7",
    "pygmsh>=7.1.17",
    "pyvista>=0.47.3",
    "pytest-xdist>=3.8.0"
]
docs = [
    "sphinx>=9.1.0",
    "setuptools_scm>=10.2.0",
    "sphinx_rtd_theme>=3.1.0",
    "sphinx_copybutton>=0.5.2",
    "sphinx_rtd_dark_mode>=1.3.0",
    "nbsphinx>=0.9.8",
    "jupyter-sphinx>=0.5.3"
]

[project.scripts]
autopdex-test = "autopdex:run_tests"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"autopdex.sim_state._native" = ["*.c"]

[tool.setuptools]
include-package-data = true

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
